<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">SourceRudder logo</title>
  <desc id="desc">SourceRudder navigation mark, product name, and the tagline Steer every search. See every source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020b14"/><stop offset="1" stop-color="#082b3d"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5defff"/><stop offset="1" stop-color="#1ce0bd"/></linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#39dff0" stroke-opacity="0.07"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="320" rx="44" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="44" fill="url(#grid)"/>
  <g transform="translate(56 38) scale(.47)" fill="none" stroke="url(#signal)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="256" cy="256" r="170" fill="#03131f" stroke-width="18"/>
    <path d="M256 54V458M54 256H458" stroke-width="18"/>
    <path d="M256 20l28 52h-56zM492 256l-52 28v-56zM256 492l-28-52h56zM20 256l52-28v56z" fill="#36e5e0" stroke="none"/>
    <circle cx="256" cy="256" r="42" fill="#36e5e0" stroke="none"/>
    <circle cx="256" cy="256" r="19" fill="#03131f" stroke="none"/>
    <circle cx="346" cy="348" r="55" fill="#041722" stroke="#e3fcff" stroke-width="15"/>
    <path d="M385 387l73 73" stroke="#e3fcff" stroke-width="27"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="350" y="150" fill="#f7fbff" font-size="82" font-weight="750" letter-spacing="-3">Source<tspan fill="url(#signal)">Rudder</tspan></text>
    <text x="354" y="207" fill="#bff8fb" font-size="31" font-weight="650">Steer every search. See every source.</text>
    <text x="354" y="252" fill="#8ca5b8" font-size="23">Self-hosted research infrastructure for AI agents</text>
  </g>
  <path d="M1020 91C1080 91 1095 146 1160 146s55 72 105 72" fill="none" stroke="#24cde4" stroke-width="3" stroke-dasharray="7 10" opacity="0.7"/>
  <g fill="#52edfa" filter="url(#glow)"><circle cx="1020" cy="91" r="7"/><circle cx="1160" cy="146" r="7"/><circle cx="1265" cy="218" r="7"/></g>
</svg>
