<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Special recognition for Gentleman Programming</title>
  <desc id="desc">An original SourceRudder community recognition card thanking Gentleman Programming for teaching, community, and strong foundations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020914"/><stop offset="0.54" stop-color="#061927"/><stop offset="1" stop-color="#0a3042"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#61efff"/><stop offset="0.55" stop-color="#20dcef"/><stop offset="1" stop-color="#1ce0b8"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#22d9e9" stop-opacity="0.26"/><stop offset="1" stop-color="#22d9e9" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#49dff0" stroke-opacity="0.075"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" rx="56" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="56" fill="url(#grid)"/>
  <circle cx="305" cy="450" r="360" fill="url(#halo)"/>
  <circle cx="1330" cy="180" r="300" fill="url(#halo)" opacity="0.6"/>
  <g fill="none" stroke="#28cade" stroke-linecap="round">
    <path d="M0 188C166 188 132 322 302 322S424 180 574 180" stroke-width="3" stroke-opacity="0.55"/>
    <path d="M1026 715C1208 715 1158 584 1330 584s142 111 270 111" stroke-width="3" stroke-opacity="0.45"/>
    <path d="M1088 110C1240 110 1248 242 1450 242" stroke-width="2" stroke-dasharray="7 14" stroke-opacity="0.38"/>
  </g>
  <g fill="#60efff" filter="url(#glow)"><circle cx="302" cy="322" r="9"/><circle cx="574" cy="180" r="7"/><circle cx="1026" cy="715" r="8"/><circle cx="1330" cy="584" r="9"/><circle cx="1450" cy="242" r="7"/></g>
  <g transform="translate(122 248)">
    <rect width="380" height="404" rx="76" fill="#03131f" stroke="#2edfea" stroke-width="3"/>
    <rect x="18" y="18" width="344" height="368" rx="61" fill="none" stroke="#75f3ff" stroke-opacity="0.2"/>
    <g transform="translate(70 74)" fill="none" stroke="url(#signal)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M88 18L20 128l68 110"/>
      <path d="M222 18l68 110-68 110"/>
      <path d="M117 128h76"/>
      <circle cx="155" cy="128" r="26" fill="#051723" stroke="#d9fcff" stroke-width="12"/>
    </g>
    <text x="190" y="348" fill="#baf8fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="5">CODE WITH PURPOSE</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="590" y="254" fill="#65effb" font-size="22" font-weight="750" letter-spacing="8">SPECIAL RECOGNITION</text>
    <text x="586" y="380" fill="#f8fcff" font-size="92" font-weight="760" letter-spacing="-3">Gentleman</text>
    <text x="586" y="478" fill="url(#signal)" font-size="92" font-weight="760" letter-spacing="-3">Programming</text>
    <text x="592" y="548" fill="#c1d4df" font-size="29">With appreciation for the teaching and community</text>
    <text x="592" y="590" fill="#c1d4df" font-size="29">that helped strengthen this project's foundations.</text>
    <g font-size="18" font-weight="650">
      <rect x="590" y="636" width="290" height="58" rx="29" fill="#09283a" stroke="#32ddeb"/>
      <text x="614" y="673" fill="#d8fbff">gentlemanprogramming.com</text>
      <rect x="900" y="636" width="355" height="58" rx="29" fill="#092b31" stroke="#20dfbd"/>
      <text x="924" y="673" fill="#d8fff7" font-size="17">github.com/Gentleman-Programming</text>
      <rect x="590" y="714" width="340" height="58" rx="29" fill="#0a2438" stroke="#48bff5"/>
      <text x="616" y="751" fill="#deefff" font-size="17">linkedin.com/in/alanbuscaglia</text>
    </g>
    <text x="592" y="827" fill="#7892a4" font-size="16" letter-spacing="1.8">INDEPENDENT ACKNOWLEDGEMENT - NO ENDORSEMENT OR AFFILIATION IMPLIED</text>
  </g>
  <g transform="translate(1330 697)" fill="none" stroke="url(#signal)" stroke-width="8" stroke-linecap="round">
    <circle cx="66" cy="66" r="55"/>
    <path d="M66 1v130M1 66h130"/>
    <circle cx="66" cy="66" r="15" fill="#23dfd2" stroke="none"/>
  </g>
  <rect x="3" y="3" width="1594" height="894" rx="53" fill="none" stroke="#55eaff" stroke-opacity="0.22" stroke-width="6"/>
</svg>
