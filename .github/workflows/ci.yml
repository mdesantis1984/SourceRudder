name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Secret scan
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts=--all .
      - name: Static security scan
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build
        run: go build -o bin/sourcerudder ./cmd/sourcerudder
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race ./...
      - name: Quality runner tests
        run: python3 -m unittest discover -s scripts/quality -p 'test_*.py' -v
      - name: Deployment contract tests
        run: |
          bash tests/k8s/k8s_deployment_test.sh
          bash tests/qa/qa_scripts_test.sh
          bash tests/release/release_assets_test.sh
          bash tests/release/release_readiness_test.sh
      - name: Compose validation
        env:
          SOURCERUDDER_AUTH_KEY: ci-compose-validation
          SEARXNG_SECRET: ci-compose-validation
          SOURCERUDDER_QUALITY_AUTH_KEY: ci-compose-validation
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f deploy/qa/docker-compose.yml config --quiet
          docker compose -f deploy/quality/docker-compose.yml config --quiet
      - name: Release identity checks
        run: bash scripts/release-readiness.sh --identity-only
