name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Secret scan
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts=--all .
      - name: Static security scan
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build
        run: go build -o bin/ia-buscar ./cmd/ia-buscar
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race ./...
      - name: Quality runner tests
        run: python3 -m unittest discover -s scripts/quality -p 'test_*.py' -v
