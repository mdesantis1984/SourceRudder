name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.repository == 'mdesantis1984/SourceRudder'
    runs-on: ubuntu-latest
    environment: release
    env:
      IMAGE: ghcr.io/mdesantis1984/sourcerudder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Verify release gates
        run: |
          bash scripts/release-readiness.sh "$GITHUB_REF_NAME"
          go vet ./...
          go test -race ./...
          python3 -m unittest discover -s scripts/quality -p 'test_*.py' -v
          bash tests/k8s/k8s_deployment_test.sh
          bash tests/qa/qa_scripts_test.sh
      - name: Resolve release version
        id: version
        run: |
          version="$(awk -F= '$1 == "VERSION" { print $2 }' Makefile)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="sourcerudder_${VERSION}_${goos}_${goarch}"
            mkdir -p "dist/$name"
            output="dist/$name/sourcerudder"
            if [ "$goos" = windows ]; then output="${output}.exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -o "$output" ./cmd/sourcerudder
            cp LICENSE README.md "dist/$name/"
            if [ "$goos" = linux ]; then
              binary_hash="$(sha256sum "$output" | awk '{print $1}')"
              printf '%s  /opt/sourcerudder/bin/sourcerudder\n' "$binary_hash" > "dist/$name/BINARY_SHA256"
            fi
            if [ "$goos" = windows ]; then
              (cd dist && zip -qr "${name}.zip" "$name")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          done
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mdesantis1984/SourceRudder
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Render immutable deployment assets
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          make release-image IMAGE_DIGEST="$IMAGE_DIGEST"
          rm -f dist/checksums.txt
          (cd dist && sha256sum ./* > checksums.txt)
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Promote immutable image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$IMAGE_DIGEST"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [ "$is_draft" = true ]; then
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber
              gh release edit "$GITHUB_REF_NAME" --draft=false --latest --verify-tag
            else
              echo "Release $GITHUB_REF_NAME is already published; immutable assets remain unchanged."
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "SourceRudder $VERSION" \
              --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
          fi
