apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-buscar
  labels:
    app: ia-buscar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ia-buscar
  template:
    metadata:
      labels:
        app: ia-buscar
    spec:
      containers:
        - name: ia-buscar
          # Immutable tag: every release ships a unique image reference.
          # The literal `<IMAGE>` placeholder is replaced by the
          # `make release-image` target which appends the current
          # commit SHA. Operators MUST NOT substitute `:latest`,
          # `:1.2.0`, or any other mutable tag here — the gate
          # script validates the image is pinned to `git rev-parse HEAD`
          # for every released commit.
          image: <IMAGE>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_URL
              value: "http://searxng:8080"
            - name: FETCH_TIMEOUT_MS
              value: "30000"
            - name: FETCH_USER_AGENT
              value: "ia-buscar/1.2.0 (compatible; +https://thiscloud.es)"
            - name: FETCH_MAX_REDIRECTS
              value: "5"
            - name: FETCH_MAX_ATTEMPTS
              value: "3"
            - name: MEMORY_URL
              value: "http://127.0.0.1:7438"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ia-buscar
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: ia-buscar
