apiVersion: v1
kind: Namespace
metadata:
  name: sourcerudder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sourcerudder
  namespace: sourcerudder
  labels:
    app: sourcerudder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sourcerudder
  template:
    metadata:
      labels:
        app: sourcerudder
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sourcerudder
          # Immutable digest: every release ships an exact image manifest.
          # The literal `<IMAGE>` placeholder is replaced by the
          # `make release-image` target which appends the current
          # release tag and digest. Operators MUST NOT substitute a tag
          # without `@sha256:...`; the release gate rejects mutable images.
          image: <IMAGE>
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: SOURCERUDDER_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: sourcerudder
                  key: auth-key
            - name: SEARXNG_URL
              valueFrom:
                configMapKeyRef:
                  name: sourcerudder
                  key: searxng-url
            - name: FETCH_TIMEOUT_MS
              value: "30000"
            - name: FETCH_USER_AGENT
              value: "SourceRudder/2.0.0"
            - name: FETCH_MAX_REDIRECTS
              value: "5"
            - name: FETCH_MAX_ATTEMPTS
              value: "3"
            # Mount an operator-curated corpus and set this path to enable
            # search_local_index. Empty keeps the provider disabled.
            - name: LOCAL_INDEX_PATH
              value: ""
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sourcerudder
  namespace: sourcerudder
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: sourcerudder
