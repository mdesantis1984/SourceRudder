name: sourcerudder-quality

networks:
  quality:
    name: sourcerudder-quality-net

services:
  searxng:
    image: searxng/searxng:2026.9.3-a1144dda3@sha256:0b8a200aaa0ec63e6595e18816c19f12d0b9d38326b9fc4123fc1fa80a438776
    restart: "no"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [quality]
    expose: ["8080"]
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: sourcerudder-quality:local
    restart: "no"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [quality]
    ports: ["127.0.0.1:18080:8080"]
    environment:
      SOURCERUDDER_AUTH_KEY: ${SOURCERUDDER_QUALITY_AUTH_KEY:?generated by live_baseline.py}
      MEMORY_URL: ""
      MEMORY_APIKEY: ""
    command:
      - -transport
      - http
      - -http-addr
      - :8080
      - -searxng-url
      - http://searxng:8080
      - -memory-url
      - ""
    depends_on:
      searxng:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
