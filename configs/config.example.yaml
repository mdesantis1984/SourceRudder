# Reference values for operators. The binary is configured through CLI flags
# and environment variables; it does not parse this file directly.
transport: stdio
http_addr: :8080
searxng_url: http://localhost:8888
cache_ttl: 300

local_index:
  # Empty disables search_local_index. Mount or create the corpus separately.
  path: ""
  example: configs/local-index.example.json

memory:
  # Optional IA_Recuerdo integration. Keep both empty to disable network I/O.
  url: ""
  api_key: ""

security:
  # Set SOURCERUDDER_AUTH_KEY in the process environment for HTTP transport.
  auth_key_env: SOURCERUDDER_AUTH_KEY
